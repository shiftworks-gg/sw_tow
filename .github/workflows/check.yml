name: check

# Branch pushes and pull requests that touch code. Tags are tested by release.yml, and text-only
# changes (README, CHANGELOG, docs) have nothing to test.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: .check
          key: check-${{ hashFiles('scripts/check.sh') }}
      - name: Static analysis (lua-language-server)
        run: bash scripts/check.sh
      - name: Lua 5.4
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - name: Offline tests (server logic, locales, config)
        run: lua tests/run.lua
